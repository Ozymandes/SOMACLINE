<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ICON. Deliberately simple: the machine's palette and its one
     gesture - a lit chamber with something alive in it - and nothing more.
     Replace before any wide release; the .desktop entry already points here,
     so a replacement needs no packaging change. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4a4f52"/>
      <stop offset="0.5" stop-color="#34383b"/>
      <stop offset="1"   stop-color="#232628"/>
    </linearGradient>
    <radialGradient id="wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#8ce0f8" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#4d9eff" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#4d9eff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- chassis -->
  <rect x="2" y="2" width="124" height="124" rx="14" fill="url(#metal)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="13.5" fill="none"
        stroke="#6a7073" stroke-opacity="0.55"/>

  <!-- observation chamber -->
  <rect x="16" y="20" width="96" height="76" rx="9" fill="#05090c"/>
  <rect x="16.5" y="20.5" width="95" height="75" rx="8.5" fill="none"
        stroke="#2ec7e0" stroke-opacity="0.75" stroke-width="1.4"/>
  <rect x="16" y="20" width="96" height="76" rx="9" fill="url(#wash)"/>

  <!-- the specimen: a plume, drawn as the equation draws it - a spine and
       the filaments that crowd around it -->
  <g stroke="#8ce0f8" fill="none" stroke-linecap="round">
    <path d="M64 88 C 56 74, 54 60, 60 44 C 63 36, 68 32, 72 30"
          stroke-width="2.1" stroke-opacity="0.95"/>
    <g stroke-width="1.15" stroke-opacity="0.62">
      <path d="M61 78 C 53 74, 48 68, 46 61"/>
      <path d="M60 70 C 52 66, 48 59, 47 52"/>
      <path d="M60 62 C 53 57, 50 50, 50 44"/>
      <path d="M61 54 C 56 48, 54 42, 55 36"/>
      <path d="M63 46 C 60 40, 60 35, 62 31"/>
      <path d="M62 78 C 70 75, 75 69, 77 62"/>
      <path d="M61 70 C 69 67, 74 61, 76 54"/>
      <path d="M61 62 C 69 58, 73 52, 74 46"/>
      <path d="M63 54 C 69 49, 72 44, 73 39"/>
    </g>
  </g>

  <!-- selector bank -->
  <g fill="#3b4043" stroke="#5d6467" stroke-opacity="0.6">
    <rect x="18" y="103" width="15" height="15" rx="3"/>
    <rect x="37" y="103" width="15" height="15" rx="3"/>
    <rect x="56" y="103" width="15" height="15" rx="3"/>
    <rect x="75" y="103" width="15" height="15" rx="3"/>
    <rect x="94" y="103" width="15" height="15" rx="3"/>
  </g>
  <rect x="18" y="103" width="15" height="15" rx="3" fill="#1d3a2a"
        stroke="#5cff8a" stroke-opacity="0.85"/>
  <circle cx="25.5" cy="110.5" r="2.6" fill="#5cff8a" fill-opacity="0.9"/>
</svg>
